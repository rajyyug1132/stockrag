name: tests-and-eval

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest -q

  rag-eval:
    # Deterministic eval gate: fully offline, no API keys, no LLM calls.
    # Live gen+judge in CI proved non-reproducible (free shared endpoints;
    # identical inputs scored faithfulness 0.86 -> 0.375 -> 0.0 across runs),
    # so CI scores a frozen answer fixture with regex-based metrics only
    # (citation_coverage, refusal_accuracy). Judge metrics run locally as
    # advisory. Regenerate the fixture after pipeline changes with:
    #   uv run python eval/run_eval.py --subset smoke --freeze eval/fixtures/smoke_answers.json
    # The ingest step stays: it's a real, deterministic integration test of
    # the parse -> chunk -> embed -> store pipeline (never hits EDGAR).
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ingest fixture filing (offline)
        run: >
          uv run stockrag ingest-file tests/fixtures/aapl_10k_excerpt.html AAPL
          --form 10-K --filing-date 2025-10-31 --accession ci-fixture
      - name: Run frozen smoke eval (deterministic gate)
        run: uv run python eval/run_eval.py --subset smoke --frozen eval/fixtures/smoke_answers.json --no-judge
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
