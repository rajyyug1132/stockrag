name: tests-and-eval

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest -q

  rag-eval:
    # Smoke eval gate: ingests a committed fixture (never hits EDGAR from CI)
    # and scores 8 questions with Ragas. Requires the NVIDIA_API_KEY secret
    # for both generation (no Ollama in CI) and the judge; Gemini free tier
    # (20 req/day) cannot cover a smoke run.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ingest fixture filing (offline)
        run: >
          uv run stockrag ingest-file tests/fixtures/aapl_10k_excerpt.html AAPL
          --form 10-K --filing-date 2025-10-31 --accession ci-fixture
      - name: Run smoke eval (Ragas gate)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run python eval/run_eval.py --subset smoke --llm nvidia --sleep 2
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
